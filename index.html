<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sprint Issue Tracker</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%236366f1'/><rect x='5' y='5' width='6' height='22' rx='2' fill='white' opacity='.5'/><rect x='13' y='5' width='6' height='16' rx='2' fill='white' opacity='.8'/><rect x='21' y='5' width='6' height='19' rx='2' fill='white'/></svg>"/>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="6" fill="#6366f1"/><rect x="5" y="5" width="6" height="22" rx="2" fill="white" opacity=".5"/><rect x="13" y="5" width="6" height="16" rx="2" fill="white" opacity=".8"/><rect x="21" y="5" width="6" height="19" rx="2" fill="white"/></svg>
    </div>
    <div class="login-title">Sprint Tracker</div>
    <div class="login-sub">팀 이슈 관리 &amp; 타임라인</div>
    <div class="form-row" style="margin-top:24px">
      <label>접근 코드</label>
      <input type="password" id="login-pw" placeholder="접근 코드를 입력하세요"/>
    </div>
    <div id="login-err">접근 코드가 올바르지 않습니다</div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;justify-content:center" onclick="doLogin()">입장하기</button>
  </div>
</div>

<div id="main-app">
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-logo">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="6" fill="#6366f1"/><rect x="5" y="5" width="6" height="22" rx="2" fill="white" opacity=".5"/><rect x="13" y="5" width="6" height="16" rx="2" fill="white" opacity=".8"/><rect x="21" y="5" width="6" height="19" rx="2" fill="white"/></svg>
        <span>Sprint Tracker</span>
      </div>
      <div class="sidebar-section-label">프로젝트</div>
      <div id="proj-list"></div>
      <button class="add-proj-btn" onclick="openProjModal()">+ 프로젝트 추가</button>
      <nav class="nav-links">
        <div class="nav-item active" id="nav-kanban" onclick="sw('kanban')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="4" height="14" rx="1.5" fill="currentColor" opacity=".5"/><rect x="6" y="1" width="4" height="10" rx="1.5" fill="currentColor" opacity=".8"/><rect x="11" y="1" width="4" height="12" rx="1.5" fill="currentColor"/></svg>
          칸반 보드
        </div>
        <div class="nav-item" id="nav-sprint" onclick="sw('sprint')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h8M2 12h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          스프린트 뷰
        </div>
        <div class="nav-item" id="nav-dash" onclick="sw('dash')">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1 8h14M1 4h14M1 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          타임라인
        </div>
      </nav>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="page-title" id="page-title">칸반 보드</div>
          <div class="page-sub" id="page-sub">프로젝트를 선택하세요</div>
        </div>
        <div class="topbar-actions">
          <button class="btn" onclick="openSpModal()">+ 스프린트</button>
          <button class="btn btn-primary" onclick="openIssModal()">+ 이슈 등록</button>
        </div>
      </div>

      <div class="content">
        <div class="view active" id="view-kanban">
          <div class="kanban-filters">
            <button class="flt on" onclick="setF('all',this)">전체</button>
            <button class="flt" onclick="setF('live',this)">라이브이슈</button>
            <button class="flt" onclick="setF('ops',this)">운영이슈</button>
            <button class="flt" onclick="setF('sprint',this)">이번 스프린트</button>
          </div>
          <div class="kanban-board" id="kboard"></div>
        </div>

        <div class="view" id="view-sprint">
          <div class="sprint-tl" id="sprint-tl"></div>
        </div>

        <div class="view" id="view-dash">
          <div class="dash-wrapper">
            <div class="dash-topbar">
              <div class="dash-metrics" id="dash-metrics"></div>
              <div class="tl-controls">
                <div class="tl-nav">
                  <button class="tl-nav-btn" onclick="tlNav(-1)">‹ 이전</button>
                  <div class="tl-range-title" id="tl-range-title"></div>
                  <button class="tl-nav-btn" onclick="tlNav(1)">다음 ›</button>
                  <button class="tl-nav-btn tl-today-btn" onclick="tlToday()">오늘</button>
                </div>
                <div class="tl-right-controls">
                  <div class="cat-sort-bar" id="cat-sort-bar"></div>
                  <div class="tl-divider"></div>
                  <select id="tl-range-sel" onchange="tlRangeChange()">
                    <option value="14">2주</option>
                    <option value="30" selected>1개월</option>
                    <option value="60">2개월</option>
                    <option value="90">3개월</option>
                  </select>
                  <div class="tl-legend">
                    <div class="leg"><div class="leg-sw" style="background:#fca5a5;border-color:#f87171"></div>라이브</div>
                    <div class="leg"><div class="leg-sw" style="background:#fcd34d;border-color:#fbbf24"></div>운영</div>
                    <div class="leg"><div class="leg-sw" style="background:#6ee7b7;border-color:#34d399"></div>해결완료</div>
                    <div class="leg"><div class="leg-sw" style="background:#c7d2fe;border-color:#818cf8"></div>진행중</div>
                  </div>
                </div>
              </div>
            </div>
            <div class="tl-scroll" id="tl-scroll">
              <div class="tl-inner" id="tl-inner"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 프로젝트 추가 모달 -->
<div class="modal-overlay" id="proj-modal">
  <div class="modal" style="max-width:340px">
    <div class="modal-head"><span class="modal-title">프로젝트 추가</span><button class="mclose" onclick="cm('proj-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>프로젝트 이름</label><input id="pname" placeholder="예: 쇼핑몰 v2.0"/></div>
      <div class="form-row"><label>색상</label>
        <div class="color-picker" id="cpicker">
          <div class="co selected" style="background:#6366f1" data-color="#6366f1" onclick="sc(this)"></div>
          <div class="co" style="background:#10b981" data-color="#10b981" onclick="sc(this)"></div>
          <div class="co" style="background:#f59e0b" data-color="#f59e0b" onclick="sc(this)"></div>
          <div class="co" style="background:#ef4444" data-color="#ef4444" onclick="sc(this)"></div>
          <div class="co" style="background:#3b82f6" data-color="#3b82f6" onclick="sc(this)"></div>
          <div class="co" style="background:#ec4899" data-color="#ec4899" onclick="sc(this)"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="cm('proj-modal')">취소</button><button class="btn btn-primary" onclick="addProj()">추가</button></div>
  </div>
</div>

<!-- 스프린트 등록/수정 모달 -->
<div class="modal-overlay" id="sp-modal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head"><span class="modal-title" id="sp-modal-title">스프린트 등록</span><button class="mclose" onclick="cm('sp-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>스프린트 이름</label><input id="sp-name" placeholder="예: Sprint 12"/></div>
      <div class="form-row"><label>서밋일 (목표 완료일)</label><input type="date" id="sp-date"/></div>
      <div class="form-row"><label>프로젝트</label><select id="sp-proj"></select></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cm('sp-modal')">취소</button>
      <button class="btn btn-primary" id="sp-submit-btn" onclick="submitSp()">등록</button>
    </div>
  </div>
</div>

<!-- 이슈 등록/수정 모달 -->
<div class="modal-overlay" id="iss-modal">
  <div class="modal">
    <div class="modal-head"><span class="modal-title" id="iss-modal-title">이슈 등록</span><button class="mclose" onclick="cm('iss-modal')">✕</button></div>
    <div class="modal-body">
      <div class="form-row"><label>카테고리</label><div class="cat-tags" id="cat-area"></div></div>
      <div class="form-2col">
        <div class="form-row"><label>발생 스프린트</label><select id="iss-sp"></select></div>
        <div class="form-row"><label>발생 날짜</label><input type="date" id="iss-date"/></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label>해결 날짜 <span style="color:var(--text3);font-weight:400;font-size:11px">(선택)</span></label><input type="date" id="iss-resolve-date"/></div>
        <div class="form-row"><label>프로젝트</label><select id="iss-proj"></select></div>
      </div>
      <div class="form-row"><label>이슈 제목</label><input id="iss-title" placeholder="이슈 제목을 입력하세요"/></div>
      <div class="form-row"><label>이슈 내용</label><textarea id="iss-content" placeholder="문제 상황을 자세히 설명하세요"></textarea></div>
      <div class="form-row"><label>해결 방안</label><textarea id="iss-sol" placeholder="해결 방안 또는 조치 사항"></textarea></div>
      <div class="form-row">
        <label>관련 스레드 <span style="color:var(--text3);font-weight:400;font-size:11px">(선택 · 여러 개는 줄 바꿈으로 구분)</span></label>
        <textarea id="iss-threads" placeholder="https://yourteam.slack.com/archives/..." style="min-height:52px;font-size:12px;font-family:monospace"></textarea>
      </div>
      <div class="form-row"><label>해결 여부</label>
        <select id="iss-status">
          <option value="todo">미해결</option>
          <option value="in-progress">진행중</option>
          <option value="done">해결완료</option>
        </select>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="cm('iss-modal')">취소</button><button class="btn btn-primary" id="iss-submit-btn" onclick="submitIss()">등록</button></div>
  </div>
</div>

<!-- 이슈 상세 모달 -->
<div class="modal-overlay" id="det-modal">
  <div class="modal" style="max-width:540px">
    <div class="modal-head">
      <div><div class="modal-title" id="det-title"></div><div class="det-proj-name" id="det-pname"></div></div>
      <button class="mclose" onclick="cm('det-modal')">✕</button>
    </div>
    <div class="det-body">
      <div class="det-sec">
        <div class="det-grid">
          <div><div class="det-lbl">카테고리</div><div id="det-cat"></div></div>
          <div><div class="det-lbl">스프린트</div><div class="det-val" id="det-sp"></div></div>
          <div><div class="det-lbl">발생일 → 해결일</div><div class="det-val" id="det-date"></div></div>
          <div><div class="det-lbl">해결 여부</div><div class="stog" id="det-stog"></div></div>
        </div>
      </div>
      <div class="det-sec"><div class="det-lbl">이슈 내용</div><div class="det-val muted" id="det-cont"></div></div>
      <div class="det-sec"><div class="det-lbl">해결 방안</div><div class="det-val muted" id="det-sol"></div></div>
      <div class="det-sec" id="det-threads-sec" style="display:none"><div class="det-lbl">관련 스레드</div><div id="det-threads"></div></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" onclick="delIss()">삭제</button>
      <button class="btn" onclick="openEditModal()">편집</button>
      <button class="btn btn-primary" onclick="cm('det-modal')">확인</button>
    </div>
  </div>
</div>

<script src="assets/js/holidays.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
